name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact names"
        required: false
        default: "dev"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset_os }}-${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64
          - runner: macos-14
            asset_os: macos
            asset_arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve artifact version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            version="${{ github.event.inputs.version }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}"
          else
            version="${{ github.ref_name }}-${GITHUB_SHA::7}"
          fi
          safe_version="$(printf '%s' "$version" | tr '/ ' '--' | tr -cd '[:alnum:]._-')"
          echo "value=${safe_version}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libncurses-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config ncurses

      - name: Configure build
        run: ./configure

      - name: Build binary
        run: make build

      - name: Set up Python (for TUI dump tests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pyte pexpect

      - name: Run tests
        run: make test

      - name: Diagnose terminfo and runtime env on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "::group::Environment"
          echo "TERM=${TERM:-unset}"
          echo "TERMINFO=${TERMINFO:-unset}"
          echo "TERMINFO_DIRS=${TERMINFO_DIRS:-unset}"
          echo "LC_ALL=${LC_ALL:-unset}"
          echo "PATH=$PATH"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "::endgroup::"

          echo "::group::Tool versions"
          which infocmp tic tput
          infocmp -V
          python --version
          python -c "import pyte, pexpect, sys; print('pyte', getattr(pyte, '__version__', '?')); print('pexpect', pexpect.__version__)"
          echo "::endgroup::"

          echo "::group::Available terminfo files for xterm-256color"
          # Show every xterm-256color terminfo entry visible to ncurses
          for d in /usr/share/terminfo /opt/homebrew/Cellar/ncurses/*/share/terminfo /opt/homebrew/share/terminfo /etc/terminfo /lib/terminfo; do
            for sub in x 78; do
              f="$d/$sub/xterm-256color"
              [[ -f "$f" ]] && echo "FOUND: $f ($(wc -c < "$f") bytes)"
            done
          done
          echo "::endgroup::"

          echo "::group::Resolved xterm-256color (infocmp)"
          infocmp xterm-256color 2>&1 | head -80
          echo "::endgroup::"

          echo "::group::Raw byte capture of failing dump test"
          python tests/dumps/_diagnose.py
          echo "::endgroup::"

      - name: Stage release files
        shell: bash
        run: |
          pkg_dir="dist/itree"
          mkdir -p "$pkg_dir"
          cp itree README.md LICENSE "$pkg_dir/"

      - name: Create release archive
        shell: bash
        run: |
          archive="itree-${{ steps.version.outputs.value }}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz"
          tar -czf "$archive" -C dist itree
          echo "ARCHIVE_NAME=$archive" >> "$GITHUB_ENV"

      - name: Generate checksum
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
